<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>受講生情報更新</title>
</head>
<body>
<h1>受講生情報更新</h1>
<form th:action="@{/updateResult}" th:object="${studentDetail}" method="post">
  <input type="hidden" th:field="*{student.id}"/>
  <div>
    <label for="nameKana">カナ（必須）:</label>
    <input type="text" id="nameKana" th:field="*{student.nameKana}" required/>
    <label for="name">名前（必須）:</label>
    <input type="text" id="name" th:field="*{student.name}" required/>
  </div>
  <div>
    <label for="nickname">ニックネーム（必須）:</label>
    <input type="text" id="nickname" th:field="*{student.nickname}" required/>
  </div>
  <div>
    <label for="mail">メールアドレス（必須）:</label>
    <input type="text" id="mail" th:field="*{student.mail}" required/>
  </div>
  <div>
    <label for="resion">都道府県:</label>
    <input type="text" id="resion" th:field="*{student.resion}">
  </div>
  <div>
    <label for="age">年齢（必須）:</label>
    <input type="text" id="age" th:field="*{student.age}" required/>
  </div>
  <div>
    <label for="gender">性別:</label>
    <input type="text" id="gender" th:field="*{student.gender}">
  </div>
  <div>
    <label for="remark">備考:</label>
    <input type="text" id="remark" th:field="*{student.remark}">
  </div>
  <div th:each="course, stat : *{studentCours}">
    <input type="hidden"
           th:id="'studentCourses_' + ${stat.index} + '_id'"
           th:field="*{studentCours[__${stat.index}__].id}"/>
    <label th:for="'studentCourses_' + ${stat.index} + '_course'">受講コース名</label>
    <input type="text"
           th:id="'studentCourses_' + ${stat.index} + '_course'"
           th:field="*{studentCours[__${stat.index}__].course}"/>
    コースをキャンセルしますか？<input type="checkbox"
                                      th:id="'studentCourses_' + ${stat.index} + '_deleted'"
                                      th:field="*{studentCours[__${stat.index}__].deleted}"/>
  </div>
  <div>
    <label for="deleted">登録をキャンセルしますか？</label>
    <input type="checkbox" id="deleted" th:field="*{student.deleted}">
  </div>
  <div>
    <button type="submit">更新</button>
  </div>
</form>
</body>
</html>
