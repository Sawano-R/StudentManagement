<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>受講生情報更新</title>
</head>
<body>
<h1>受講生情報更新</h1>
<form th:action="@{/updateStudentHere}" th:object="${studentDetail}" method="post">
  <div>
    <label for="name">名前（必須）:</label>
    <input type="text" id="name" th:field="*{student.name}" required/>
  </div>
  <div>
    <button type="submit">更新画面へ</button>
  </div>
</form>
</body>
</html>
