<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>コース登録</title>
</head>
<body>
<h1>コース登録</h1>
<form th:action="@{/registerCourse}" th:object="${studentDetail}" method="post">
  <div>
    <label for="name">名前（必須）:</label>
    <input type="text" id="name" th:field="*{student.name}" required/>
  </div>
  <div>
    <label for="Course">コース（必須）:</label>
    <input type="text" id="Course" th:field="*{studentCours[0].course}" required/>
  </div>
  <div>
    <button type="submit">登録</button>
  </div>
</form>
</body>
</html>
